<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype — Accessible Video Processor</title>
<style>
:root{color-scheme:dark;--bg:#0f141e;--surface:#191f2b;--border:#2a3345;--text:#e4ebf5;--muted:#8a99b8;--accent:#5b9cf5;--green:#6ecf8a;--red:#f07070;--radius:10px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.55 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header{margin-bottom:20px}
h1{font-size:1.5em;font-weight:600}
h2{font-size:1em;color:var(--muted);margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
input,select,button{font:inherit;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:7px 10px}
input[type=file]{padding:6px}
button{cursor:pointer;font-weight:500;transition:background .15s}
button:hover{background:#232d3e}
.btn{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;padding:7px 16px}
.btn:hover{background:#6aabff}
.btn-sm{padding:4px 10px;font-size:.85em}
select,button:disabled{opacity:.5;cursor:default}
.badge{display:inline-block;background:var(--accent);color:#000;border-radius:4px;padding:1px 7px;font-size:.8em;font-weight:600}
.status{font-size:.85em;color:var(--muted);margin-top:4px}
#videoPlayer{width:100%;max-height:420px;background:#000;border-radius:8px}
.controls{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tab-bar{display:flex;gap:4px;margin-bottom:10px}
.tab-btn{padding:5px 12px;border-radius:6px 6px 0 0;border-bottom:none;font-size:.85em}
.tab-btn.active{background:var(--surface);border-color:var(--border);border-bottom:1px solid var(--surface);position:relative;z-index:1}
.tab-content{display:none}
.tab-content.active{display:block}
.list{padding:0;list-style:none}
.list li{padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:.9em}
.list li:hover{color:var(--accent)}
.description-box{min-height:60px;color:var(--muted);font-size:.95em;line-height:1.6}
.description-box:empty::after{content:"Press Describe Scene (D key) during playback."}
#subOverlay{position:absolute;bottom:50px;left:0;right:0;text-align:center;pointer-events:none;z-index:2}
.subtitle-word{display:inline-block;margin:0 1px;transition:color .15s}
.subtitle-word.past{color:rgba(255,255,255,.3)}
.subtitle-word.current{color:#ffd64d}
.subtitle-word.future{color:rgba(255,255,255,.5)}
.video-wrap{position:relative;border-radius:8px;overflow:hidden}
.a11y-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85em}
.a11y-row label{color:var(--muted)}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">

<header>
  <h1>🎬 Prototype — Accessible Video Processor</h1>
</header>

<!-- Upload -->
<div class="panel">
  <h2>Upload &amp; Process</h2>
  <div class="row">
    <div class="col">
      <input type="file" id="uploadInput" accept="video/*">
    </div>
    <div class="col">
      <select id="langSelect"><option value="en">English</option><option value="ru">Russian</option></select>
    </div>
    <div>
      <label><input type="checkbox" id="visualCheck" checked> Scene descriptions</label>
    </div>
    <div>
      <button class="btn" id="uploadBtn">Process</button>
    </div>
  </div>
  <div class="status" id="uploadStatus"></div>
</div>

<!-- Job selector -->
<div class="panel">
  <h2>Jobs</h2>
  <select id="jobSelect" style="width:100%"><option value="">Select a job...</option></select>
</div>

<!-- Video player -->
<div class="panel">
  <div class="video-wrap">
    <video id="videoPlayer" controls></video>
    <div id="subOverlay" class="hidden"></div>
  </div>
  <div class="controls">
    <button class="btn" id="descBtn">🔊 Describe Scene</button>
    <button id="stopDescBtn" disabled>⏹ Stop</button>
    <select id="speedSelect">
      <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
      <option value="1" selected>1x</option><option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option><option value="2">2x</option>
    </select>
    <span class="badge" id="langBadge">--</span>
  </div>
</div>

<!-- Description -->
<div class="panel">
  <h2>Scene Description</h2>
  <div class="description-box" id="descText"></div>
  <div class="status" id="descMeta"></div>
</div>

<!-- Tabs: Summary / Chapters / Scenes -->
<div class="panel">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="summary">Summary</button>
    <button class="tab-btn" data-tab="chapters">Chapters</button>
    <button class="tab-btn" data-tab="scenes">Scenes</button>
  </div>
  <div class="tab-content active" id="tab-summary"><div id="summaryContent" style="line-height:1.7"></div></div>
  <div class="tab-content" id="tab-chapters"><ul class="list" id="chapterList"></ul></div>
  <div class="tab-content" id="tab-scenes"><ul class="list" id="sceneList"></ul></div>
</div>

<!-- Accessibility -->
<div class="panel">
  <h2>Accessibility</h2>
  <div class="a11y-row">
    <label>UI size:</label><button class="btn-sm" onclick="adjUi(-1)">A-</button><button class="btn-sm" onclick="adjUi(0)">A</button><button class="btn-sm" onclick="adjUi(1)">A+</button>
    <label style="margin-left:8px">Sub size:</label><button class="btn-sm" onclick="adjSub(-1)">A-</button><button class="btn-sm" onclick="adjSub(0)">A</button><button class="btn-sm" onclick="adjSub(1)">A+</button>
    <label style="margin-left:8px">Mode:</label><select id="subMode"><option value="word">Word-by-word</option><option value="segment">Segments</option></select>
    <button id="dysBtn" class="btn-sm" onclick="toggleDys()">Dyslexia font</button>
    <button id="spacingBtn" class="btn-sm" onclick="toggleSpacing()">Wide spacing</button>
    <button id="contrastBtn" class="btn-sm" onclick="toggleContrast()">High contrast</button>
  </div>
</div>

</div>

<script>
const A = '';

let currentJobId = null;
let words = [], currentWordIdx = -1;
let descActive = false;

// ── Helper ──
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// ── Upload ──
document.getElementById('uploadBtn').onclick = async () => {
  const f = document.getElementById('uploadInput').files[0];
  if (!f) return;
  const s = document.getElementById('uploadStatus');
  s.textContent = 'Uploading...';
  try {
    const vis = document.getElementById('visualCheck').checked;
    const lang = document.getElementById('langSelect').value;
    const r = await fetch(`/process-upload?language=${lang}&enable_visual=${vis}`, {
      method: 'POST', headers: {'X-Upload-Filename': f.name, 'Content-Type': f.type||'video/mp4'}, body: f
    });
    const d = await r.json();
    s.innerHTML = `<span style="color:var(--green)">Queued: ${d.job_id}</span>`;
    document.getElementById('uploadInput').value = '';
    setTimeout(loadJobs, 2000);
  } catch(e) { s.textContent = 'Upload failed'; }
};

// ── Jobs ──
async function loadJobs() {
  const sel = document.getElementById('jobSelect');
  const prev = sel.value;
  try {
    const d = await api('/jobs');
    sel.innerHTML = '<option value="">Select a job...</option>';
    (d.jobs||[]).forEach(j => {
      const o = document.createElement('option');
      o.value = j.job_id;
      o.textContent = `${j.status==='completed'?'✅':'⏳'} ${j.video_file||j.job_id} [${j.language}]`;
      sel.appendChild(o);
    });
    if (prev) sel.value = prev;
  } catch(e) {}
}

document.getElementById('jobSelect').onchange = async function() {
  const id = this.value;
  if (!id) return currentJobId = null;
  currentJobId = id;
  document.getElementById('videoPlayer').src = `/jobs/${id}/video`;
  try { document.getElementById('langBadge').textContent = (await api(`/jobs/${id}/meta`)).language||'--'; } catch(e) {}
  loadWords();
  loadSummary();
};

async function loadWords() {
  if (!currentJobId) return;
  try {
    const d = await api(`/jobs/${currentJobId}/words`);
    words = d.segments ? d.segments.flatMap(s => s.words||[]) : [];
    renderSubtitles();
  } catch(e) {}
}

async function loadSummary() {
  if (!currentJobId) return;
  try {
    const d = await api(`/jobs/${currentJobId}/summary`);
    document.getElementById('summaryContent').innerHTML = (d.summary_points||[]).map(p=>`<p>• ${p}</p>`).join('');
    document.getElementById('chapterList').innerHTML = (d.chapters||[]).map(c=>`<li onclick="jump(${c.start})">${c.title} (${fmt(c.start)})</li>`).join('');
  } catch(e) {}
  try {
    const d = await api(`/jobs/${currentJobId}/scenes`);
    document.getElementById('sceneList').innerHTML = (d.scenes||[]).map(s=>`<li onclick="jump(${s.time})">${fmt(s.time)} — ${esc(s.description)}</li>`).join('');
  } catch(e) {}
}

// ── Subtitle overlay ──
function renderSubtitles() {
  const ov = document.getElementById('subOverlay');
  if (!words.length) { ov.classList.add('hidden'); return; }
  ov.classList.remove('hidden');
  const mode = document.getElementById('subMode').value;
  if (mode === 'segment') { ov.innerHTML = ''; return; }
  ov.innerHTML = words.map((w,i) => `<span class="subtitle-word future" data-idx="${i}">${esc(w.word)}</span>`).join(' ');
  currentWordIdx = -1;
}

document.getElementById('videoPlayer').ontimeupdate = () => {
  if (descActive) return;
  const t = document.getElementById('videoPlayer').currentTime;
  const mode = document.getElementById('subMode').value;
  if (mode === 'segment') return;
  let idx = -1;
  for (let i = 0; i < words.length; i++) {
    if (words[i].start <= t && words[i].end >= t) { idx = i; break; }
  }
  if (idx === currentWordIdx) return;
  currentWordIdx = idx;
  document.querySelectorAll('.subtitle-word').forEach(el => {
    const i = +el.dataset.idx;
    if (i < idx) el.className = 'subtitle-word past';
    else if (i === idx) el.className = 'subtitle-word current';
    else el.className = 'subtitle-word future';
  });
  if (idx >= 0) {
    const el = document.querySelector('.subtitle-word.current');
    if (el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
};

// ── Describe / TTS ──
document.getElementById('descBtn').onclick = async () => {
  if (!currentJobId) return;
  const v = document.getElementById('videoPlayer');
  const t = v.currentTime;
  v.pause();
  descActive = true;
  document.getElementById('descBtn').disabled = true;
  document.getElementById('stopDescBtn').disabled = false;
  try {
     const d = await api(`/jobs/${currentJobId}/describe`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({time:t,language:'en'})});
     document.getElementById('descText').textContent = d.description;
     document.getElementById('descMeta').textContent = `Scene #${d.scene_id} at ${fmt(d.time)}`;
     if (d.tts_audio_url) {
       const a = new Audio(d.tts_audio_url);
       a.onended = stopDesc;
       a.play();
     } else { stopDesc(); }
  } catch(e) { stopDesc(); }
};

document.getElementById('stopDescBtn').onclick = () => stopDesc(false);
function stopDesc(resume=true) {
  descActive = false;
  document.getElementById('descBtn').disabled = false;
  document.getElementById('stopDescBtn').disabled = true;
  if (resume) document.getElementById('videoPlayer').play();
}

// ── Speed ──
document.getElementById('speedSelect').onchange = function() {
  document.getElementById('videoPlayer').playbackRate = +this.value;
};

// ── Tabs ──
document.querySelectorAll('.tab-btn').forEach(b => b.onclick = function() {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
  this.classList.add('active');
  document.getElementById('tab-'+this.dataset.tab).classList.add('active');
});

// ── Accessibility buttons ──
let uiSize=100, subSize=100;
function adjUi(d) { uiSize=Math.max(70,Math.min(160,uiSize+(d?d*15:0))); if(d===0)uiSize=100; document.body.style.fontSize=(uiSize/100)+'em'; }
function adjSub(d) { subSize=Math.max(70,Math.min(160,subSize+(d?d*15:0))); if(d===0)subSize=100; document.getElementById('subOverlay').style.fontSize=(subSize/100*1.1)+'em'; }
function toggleDys() {
  const b = document.getElementById('dysBtn');
  b.classList.toggle('active');
  document.body.style.fontFamily = b.classList.contains('active') ? "'OpenDyslexic',sans-serif" : '';
}
function toggleSpacing() {
  const b = document.getElementById('spacingBtn');
  b.classList.toggle('active');
  document.body.style.lineHeight = b.classList.contains('active') ? '2.2' : '';
  document.body.style.wordSpacing = b.classList.contains('active') ? '0.16em' : '';
  document.body.style.letterSpacing = b.classList.contains('active') ? '0.03em' : '';
}
function toggleContrast() {
  const b = document.getElementById('contrastBtn');
  b.classList.toggle('active');
  if (b.classList.contains('active')) {
    document.body.style.background = '#000';
    document.body.style.color = '#fff';
    document.querySelectorAll('.panel').forEach(p => { p.style.background='#111'; p.style.borderColor='#444'; });
  } else {
    document.body.style.background = ''; document.body.style.color = '';
    document.querySelectorAll('.panel').forEach(p => { p.style.background=''; p.style.borderColor=''; });
  }
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'd' || e.key === 'D') document.getElementById('descBtn').click();
  if (e.key === 's' || e.key === 'S') document.getElementById('stopDescBtn').click();
  if (e.key === ' ') { e.preventDefault(); const v = document.getElementById('videoPlayer'); v.paused ? v.play() : v.pause(); }
});

// ── Helpers ──
function fmt(s) { return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jump(t) { const v = document.getElementById('videoPlayer'); v.currentTime = t; v.play(); }

// ── Init ──
loadJobs();
setInterval(loadJobs, 8000);
</script>
</body>
</html>
